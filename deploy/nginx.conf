worker_processes 1;

# Paths writable by the non-root user running nginx via PM2
pid /home/admin11/workspace/mengxiq/nginx.pid;
error_log /home/admin11/workspace/mengxiq/logs/nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Increase proxy buffers to handle large JS bundles
    proxy_buffer_size   128k;
    proxy_buffers       8 256k;
    proxy_busy_buffers_size 256k;

    access_log /home/admin11/workspace/mengxiq/logs/nginx-access.log;

    server {
        listen 3069 ssl;
        server_name raspberrypi.local;

        ssl_certificate     /home/admin11/workspace/mengxiq/certs/cert.pem;
        ssl_certificate_key /home/admin11/workspace/mengxiq/certs/key.pem;

        # React app (served by http-server on port 3019)
        location / {
            proxy_pass http://127.0.0.1:3019;
            proxy_set_header Host $host;
        }

        # Queue DB (json-server on port 8002)
        location /api/db/ {
            proxy_pass http://127.0.0.1:8002/;
            proxy_set_header Host $host;
        }

        # Report DB (json-server on port 8001)
        location /api/report/ {
            proxy_pass http://127.0.0.1:8001/;
            proxy_set_header Host $host;
        }

        # Meilisearch (port 8011)
        location /api/search/ {
            proxy_pass http://127.0.0.1:8011/;
            proxy_set_header Host $host;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 3068;
        server_name raspberrypi.local;
        return 301 https://$host:3069$request_uri;
    }
}
